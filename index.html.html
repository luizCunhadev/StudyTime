<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>StudyTime</title>
<style>

.mdot{width:8px;height:8px;border-radius:50%;background:#64748b;flex:none}.mdot.on{background:#2dd4bf;box-shadow:0 0 8px #2dd4bf}.pmu{display:flex;align-items:center;gap:6px;border-top:1px solid rgba(255,255,255,.1);padding-top:8px}.mt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--m)}.pmu input{width:64px;padding:0;border:0;background:none;accent-color:#2dd4bf}

#brain{position:relative;height:clamp(210px,36vh,290px);margin:0 0 4px;background:radial-gradient(60% 60% at 50% 45%,rgba(45,212,191,.14),transparent 70%)}#brain::after{content:'';position:absolute;left:25%;right:25%;bottom:4px;height:12px;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent);pointer-events:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cd{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--bg);color:var(--m)}.cd.e{background:none}.cd.on{background:var(--a);color:#fff;font-weight:700}.cd.td{outline:2px solid var(--t);outline-offset:-2px}
.ac{border:1px solid var(--b);border-radius:12px;padding:14px;background:var(--c);display:flex;flex-direction:column;gap:6px}.ac.ok{border-color:var(--a)}.bg{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:var(--m);flex:none}.ac.ok .bg{background:var(--a);color:#fff}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .cd.on,:root:not([data-theme=light]) .ac.ok .bg{color:#06201d}}:root[data-theme=dark] .cd.on,:root[data-theme=dark] .ac.ok .bg{color:#06201d}
.pp{display:flex;flex-direction:column;gap:8px;padding:10px 12px;min-height:100vh;justify-content:center}.pp .clock{font-size:42px}.px .clock{font-size:56px}.pp .bt{padding:6px 12px}.pp .row{margin-top:0}.pm{flex-direction:row;align-items:center;justify-content:space-between}.pm .clock{font-size:28px}
body.pg{background:radial-gradient(120% 140% at 0% 0%,rgba(45,212,191,.22),transparent 55%),linear-gradient(160deg,#16262d,#0b1319);color:#e6f4f1;--t:#e6f4f1;--m:#8fb3ad;--a:#2dd4bf;--b:rgba(255,255,255,.12);--c:rgba(255,255,255,.06);font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif}
.pg .pp{margin:6px;min-height:calc(100vh - 12px);border:1px solid rgba(255,255,255,.14);border-radius:18px;background:linear-gradient(145deg,rgba(255,255,255,.11),rgba(255,255,255,.03));-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.pg .pp .clock{font-size:40px;font-weight:300;color:var(--a);text-shadow:0 0 18px rgba(45,212,191,.35)}.pg .pp.px .clock{font-size:52px}.pg .pp.pm .clock{font-size:26px}
.pg .pp.paused .clock{color:#f5c26b;text-shadow:0 0 18px rgba(245,194,107,.3)}
.pg .pp .clock{line-height:1.1}.pg .pp .row{justify-content:center}body.pg{overflow-x:hidden}
.pg .bt{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#e6f4f1;border-radius:10px;padding:6px 12px;transition:background .15s,transform .1s}.pg .bt:hover{background:rgba(255,255,255,.16)}.pg .bt:active{transform:scale(.94)}
.pg .bt.ic{width:36px;height:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.pg .bt.pri{background:rgba(45,212,191,.28);border-color:rgba(45,212,191,.6);color:#bff7ee}.pg .bt.pri:hover{background:rgba(45,212,191,.42)}.pg .bt.dng{color:#fda4a4;border-color:rgba(253,164,164,.4)}
.pg input,.pg textarea{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.14);color:#e6f4f1}
.pg .pp.running .pill{background:rgba(45,212,191,.25);color:#bff7ee}.pg .pp.paused .pill{background:rgba(245,194,107,.25);color:#f5c26b}
.ph{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--m)}.dot{width:8px;height:8px;border-radius:50%;background:#2dd4bf;box-shadow:0 0 8px #2dd4bf}.paused .dot{background:#f5c26b;box-shadow:0 0 8px #f5c26b}
.sb{margin-left:auto;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:rgba(255,255,255,.08);border-radius:6px;padding:0 7px;color:#e6f4f1}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.seg{display:inline-flex;gap:2px;padding:3px;margin:2px 0 12px;background:var(--c);border:1px solid var(--b);border-radius:10px;max-width:100%;overflow-x:auto}.seg button{border:0;background:none;color:var(--m);font:inherit;font-size:14px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}.seg button.on{background:rgba(45,212,191,.18);color:var(--a)}
.pn{background:var(--c);border:1px solid var(--b);border-radius:14px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}.pn.open{border-color:rgba(45,212,191,.45)}
.ph2{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;cursor:pointer;color:var(--t);transition:background .15s}.ph2:hover{background:rgba(45,212,191,.07)}.ph2:focus-visible{outline:2px solid var(--a);outline-offset:-2px}
.pic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(45,212,191,.12);color:var(--a);flex:none}.pic svg{width:20px;height:20px}
.ptx{flex:1;min-width:0}.ptx b{display:block;font-size:16px}.ptx span{font-size:13px;color:var(--m)}.pn.open .ptx span{display:none}
.chv{color:var(--m);transition:transform .25s;display:flex}.chv svg{width:18px;height:18px}.pn.open .chv{transform:rotate(180deg)}
.pb{display:grid;grid-template-rows:0fr;visibility:hidden;transition:grid-template-rows .3s ease,visibility 0s .3s}.pn.open .pb{grid-template-rows:1fr;visibility:visible;transition:grid-template-rows .3s ease,visibility 0s}
.pi{overflow:hidden;min-height:0}.pc{padding:2px 14px 12px}
.pi .card{background:var(--bg)}.pi .card input,.pi .card select,.pi .card textarea{background:var(--c)}.pi .cd{background:var(--c)}.pi .cd.e{background:none}.pi .cd.on{background:var(--a)}
@media(prefers-reduced-motion:reduce){.pb,.chv,.pn{transition:none}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script></head><body>
<header class="top"><h1 class="logo">StudyTime</h1><div id="brain" role="img" aria-label="Cérebro 3D animado"></div><div class="hello a"><h2>Olá, Luiz!</h2><p>Cada minuto de estudo é um passo em direção aos seus objetivos.</p></div></header><main id="main"></main><div id="ov"></div><div id="mdock" hidden><div class="mdh"><span id="mdt">YouTube</span><button class="bt" data-a="mclose" aria-label="Fechar player">×</button></div><div id="mfr"></div></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const ymd=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const hms=ms=>{ms=Math.floor(ms/1000);return p2(Math.floor(ms/3600))+':'+p2(Math.floor(ms%3600/60))+':'+p2(ms%60)};
const fmt=ms=>{const s=Math.round(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+'h'+p2(m)+'min'+(x?p2(x)+'s':''):m?m+'min'+(x?p2(x)+'s':''):x+'s'};
const fm=ms=>{const m=Math.round(ms/6e4);return m>=60?Math.floor(m/60)+'h'+(m%60?p2(m%60)+'min':''):m+'min'};
const hh=t=>new Date(t).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const dBR=d=>d.split('-').reverse().join('/');
const addD=(d,n)=>{const x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return ymd(x)};
const wkStart=d=>addD(d,-((new Date(d+'T12:00:00').getDay()+6)%7));
let db,T=null,goals={d:60,w:420,m:1800},S=[],subs=[],tab='home',F={q:'',s:'',a:'',b:'',},cb=null,cbBack=null;
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const kvGet=k=>rq(st('kv').get(k)),kvSet=(k,v)=>rq(st('kv','readwrite').put(v,k)),kvDel=k=>rq(st('kv','readwrite').delete(k));
const saveT=()=>T?kvSet('timer',T):kvDel('timer');
const loadS=async()=>{S=(await rq(st('sessions').getAll())).sort((a,b)=>b.start-a.start);await checkAch()};
function toast(m){const e=document.createElement('div');e.className='ts';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
const el=()=>T?T.acc+(T.status==='running'?Date.now()-T.runStart:0):0;
const sum=(a,b)=>S.filter(s=>s.date>=a&&s.date<=b).reduce((x,s)=>x+s.ms,0);
const days=(a,b)=>new Set(S.filter(s=>s.date>=a&&s.date<=b).map(s=>s.date)).size;
const dayMs=d=>sum(d,d);
const allSubs=()=>[...new Set([...subs,...S.map(s=>s.subject).filter(Boolean)])].sort();
const dl=()=>'<datalist id="dl">'+allSubs().map(s=>'<option value="'+esc(s)+'">').join('')+'</datalist>';
const pct=(v,g)=>Math.min(100,g?Math.round(v/g*100):0);
const prog=(v,g,l)=>'<div>'+l+': <b>'+fm(v)+'</b> de '+fm(g)+' ('+pct(v,g)+'%)'+(v>=g?' — meta atingida!':' — faltam '+fm(g-v))+'</div><div class="bar"><i style="width:'+pct(v,g)+'%"></i></div>';
const bars=a=>{const mx=Math.max(...a.map(x=>x.v),1);return '<div class="ch">'+a.map(x=>'<div title="'+esc(x.l)+': '+fm(x.v)+'"><b style="height:'+Math.round(x.v/mx*90)+'%"></b>'+esc(x.l)+'</div>').join('')+'</div>'};
function modal(h){$('#ov').innerHTML=h?'<div class="ov"><div class="md">'+h+'</div></div>':''}
function ask(msg,yes,back){cb=yes;cbBack=back;modal('<p>'+msg+'</p><div class="row"><button class="bt" data-a="no">Cancelar</button><button class="bt dng" data-a="yes">Confirmar</button></div>')}
const tabs={home:'Início',prog:'Progresso',est:'Estudos',mus:'Música',cfg:'Ajustes'};
const views={
home(){const s=T?T.status:'idle',lab={idle:'Parado',running:'Em andamento',paused:'Pausado'}[s],t=ymd(Date.now());
 const b={idle:'<button class="bt pri" data-a="start">Iniciar</button>',running:'<button class="bt" data-a="pause">Pausar</button><button class="bt pri" data-a="end">Encerrar</button><button class="bt dng" data-a="reset">Restaurar</button>',paused:'<button class="bt pri" data-a="resume">Retomar</button><button class="bt" data-a="end">Encerrar</button><button class="bt dng" data-a="reset">Restaurar</button>'}[s];
 return '<div class="card '+s+'"><div style="text-align:center"><span class="pill">'+lab+'</span></div><div class="clock" id="clk">'+hms(el())+'</div><div class="row">'+b+'</div>'+(pipOK?'<div class="row" style="margin-top:6px"><button class="bt" data-a="pip">⧉ Painel flutuante</button></div>':'<div class="k" style="text-align:center;margin-top:8px">Painel flutuante: use Chrome ou Edge (v116+) no computador.</div>')+'<label for="subj">O que você vai estudar? (opcional)</label><input id="subj" list="dl" placeholder="Ex.: Python" value="'+esc(T?T.subject:'')+'">'+dl()+'</div><div class="card"><h2>Hoje</h2>'+prog(dayMs(t),goals.d*6e4,'Estudado')+'<div class="k">Só sessões agregadas contam.</div></div>'},
ov(){const t=ymd(Date.now()),ws=wkStart(t),ms=t.slice(0,7)+'-01',tot=S.reduce((x,s)=>x+s.ms,0),n=new Set(S.map(s=>s.date)).size,wk=[];
 for(let i=7;i>=0;i--){const a=addD(ws,-7*i);wk.push({l:a.slice(8)+'/'+a.slice(5,7),v:sum(a,addD(a,6))})}
 return '<div class="grid">'+[['Hoje',fm(dayMs(t))],['Esta semana',fm(sum(ws,t))],['Este mês',fm(sum(ms,t))],['Total geral',fm(tot)],['Média por dia estudado',n?fm(tot/n):'—'],['Dias estudados',n]].map(x=>'<div class="card"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join('')+'</div><div class="card"><h2>Horas por semana</h2>'+bars(wk)+'</div>'},
hist(){return '<div class="card"><div class="grid"><div><label>Buscar</label><input data-f="q" value="'+esc(F.q)+'" placeholder="assunto ou observação"></div><div><label>Assunto</label><select data-f="s"><option value="">Todos</option>'+allSubs().map(s=>'<option'+(F.s==s?' selected':'')+'>'+esc(s)+'</option>').join('')+'</select></div><div><label>De</label><input type="date" data-f="a" value="'+F.a+'"></div><div><label>Até</label><input type="date" data-f="b" value="'+F.b+'"></div></div></div><div class="card" id="list">'+histList()+'</div>'},
subj(){const m={};S.forEach(s=>{const k=s.subject||'Sem assunto';(m[k]=m[k]||{ms:0,n:0,d:''}).ms+=s.ms;m[k].n++;if(s.date>m[k].d)m[k].d=s.date});const tot=S.reduce((x,s)=>x+s.ms,0),t=ymd(Date.now()),ws=wkStart(t),ms=t.slice(0,7)+'-01';
 const e=Object.entries(m).sort((a,b)=>b[1].ms-a[1].ms);if(!e.length)return '<div class="card em">Nenhuma sessão agregada ainda. Estude e agregue sua primeira sessão.</div>';
 return '<div class="card"><h2>Distribuição do tempo</h2><div class="k">Cada sessão pertence a um único assunto, então nenhuma hora é contada duas vezes.</div>'+e.map(([k,v])=>{const w=S.filter(s=>(s.subject||'Sem assunto')==k);const f=a=>w.filter(s=>s.date>=a).reduce((x,s)=>x+s.ms,0);return '<div class="it"><div style="flex:1"><b>'+esc(k)+'</b> <span class="k">'+v.n+' sessões · última: '+dBR(v.d)+'</span><div class="bar"><i style="width:'+pct(v.ms,tot)+'%"></i></div><span class="k">Semana: '+fm(f(ws))+' · Mês: '+fm(f(ms))+'</span></div><div style="text-align:right"><b>'+fm(v.ms)+'</b><div class="k">'+pct(v.ms,tot)+'%</div></div></div>'}).join('')+'</div>'},
